<!DOCTYPE html>

    <title>Settings - Security Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'Noto Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', 'monospace']

                },
            },
        }
    </script>
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">

<body class="font-sans bg-gray-50 text-gray-800">
    <header class="sticky top-0 z-50 border-b border-gray-200 bg-white/80 backdrop-blur shadow-sm">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <div class="flex items-center gap-3">
                    <a href="/" class="flex h-10 w-10 items-center justify-center rounded-lg bg-teal-600 border border-teal-700 hover:bg-teal-700 transition-colors">
                        <svg class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M12 2l8 4v6c0 5-3.5 9.5-8 10-4.5-.5-8-5-8-10V6l8-4z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
                            <path d="M9.5 12l1.7 1.7L14.8 10" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                    <div class="leading-tight">

                        <div class="text-xs text-gray-500">Settings</div>
                    </div>
                </div>
                <nav class="hidden md:flex items-center space-x-1">

                    <a href="/simulation" class="px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50 rounded-lg">Simulation</a>
                    <a href="/reports" class="px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50 rounded-lg">Reports</a>
                    <a href="/settings" class="px-3 py-2 text-sm font-medium rounded-lg text-teal-700 bg-teal-50">Settings</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Settings</h1>
                <p class="text-gray-600">System configuration and preferences.</p>
            </div>
        </div>

        <section class="rounded-xl border border-gray-200 bg-white p-6">
            <div class="text-center">
                <h2 class="text-lg font-semibold text-gray-800">Coming Soon</h2>
                <p class="mt-2 text-gray-500">This section is under construction. Configuration options for detection thresholds, alert preferences, and integrations will be available here in a future update.</p>
            </div>
        </section>
    </main>
